<!DOCTYPE html>
<html lang="pt.br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    <h1>inserindo videos hospedados localmente</h1>
    <p>ESte video esta hospedado no meu prorpio servidor</p>

    <video width="560" controls autoplay loop>
        <source src="midia/meu-Video.webm.webm" type="video/webm">
        <source src="midia/meu-Video.m4v.Mp4" type="video/mp3">
        <source src="midia/meu-video.mp4.mp4" type="video/mp4">
        <source src="midia/meu-video.ogv.ogv" type="video/ogv">
        <p>Infelizmente seu navegador nao tem compactibilidade com reproduçoes de video</p>
    </video>
    <h1>insrindo videos do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/3hng-hmSv2Y?si=AmEJQVf635FakGUE" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
